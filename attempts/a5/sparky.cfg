# Sparky oscillators in B3/S23-a5: everything above row 0 is empty, a spark
# cell starts at (0,0) on that edge, and only results that put live cells into
# the empty area are reported. complete.py --sparky then checks that the
# oscillator's own cycle (not just the transient) throws the spark.
rule = B3/S23-a5
clear = r -60 -60 -1 60
must-reach = r -60 -60 -1 60
skip = fizzle, stable
min-period = 5
per-rotor = 5
no-rle
pattern:
x = 1, y = 1, rule = LifeHistory
C!
