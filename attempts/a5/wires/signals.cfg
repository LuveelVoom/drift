# Any signal: single spark, no direction or speed forced, report what is still
# going at max gen. Large margin so signals don't reach the (checked) border.
rule = B3/S23-a5
max-changed = 6
size = 4x4
margin = 50
max-gen = 80
skip = oscillator, fizzle, stable
no-pics
pattern:
x = 1, y = 1, rule = LifeHistory
C!
