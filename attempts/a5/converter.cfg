# Spark converter: a spark arrives from empty space at (0,0), the reaction
# crosses a still life confined to a 7x7 box (rows -3..3, cols 1..7), puts a
# live cell into empty space at least 2 cells outside the box, and the box
# returns to its original still life (a fizzle).
rule = B3/S23-a5
max-changed = 8
size = 5x5
clear = r -40 -40 -4 50         # empty above the box
clear = r 4 -40 40 50           # empty below
clear = r -3 -40 3 0            # empty to the left (where the spark comes from)
clear = r -3 8 3 50             # empty to the right
must-reach = r -40 -40 -5 50    # output spark: 2+ cells above the box,
must-reach = r 5 -40 40 50      #   below it,
must-reach = r -40 9 40 50      #   or to its right
skip = oscillator, stable
per-rotor = 3
pattern:
x = 1, y = 1, rule = LifeHistory
C!
