# The oblique (4,1)c/6 signal of B3/S23-q4i on a long track: a single spark,
# kept moving (4,-1) per 6 gens and within 15 cells of that line, still going
# at gen 160.
rule = B3/S23-q4i
max-changed = 6
size = 4x4
margin = 100
max-gen = 160
push = 4,-1 c/6 10
push = 1,4 0 15
push = -1,-4 0 15
skip = oscillator, fizzle, stable
max-results = 5
no-pics
pattern:
x = 1, y = 1, rule = LifeHistory
C!
