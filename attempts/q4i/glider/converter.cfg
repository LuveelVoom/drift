# HighLife: a glider flies down-right out of empty space into unknown cells.
# Converters: the still life recovers and something keeps travelling.
# (a reflected glider, another spaceship or a signal).
rule = B3/S23-q4i
max-changed = 16
size = 14x14
skip = oscillator, fizzle, stable
per-rotor = 0
margin = 50
max-gen = 120
clear = r -30 -30 4 -1       # empty space behind and beside the glider's start
clear = r -30 -30 -1 4
max-steps = 4000000000

threads = 4
pattern:
x = 5, y = 5, rule = LifeHistory
BBBBB$BBCBB$BBBCB$BCCCB$BBBBB!
