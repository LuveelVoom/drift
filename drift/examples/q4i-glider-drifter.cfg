# A glider flies in from infinity (cleared space behind and beside it) into an
# unknown background in B3/S23-q4i. no-rechange keeps the disturbance moving onto
# fresh cells, so drift builds a track for it as it goes: the glider becomes a
# drifter. The best of these are in ../../findings/B3-S23-q4i/best-glider-drifter.txt.
rule = B3/S23-q4i
max-changed = 10
size = 6x6
skip = stable, oscillator
margin = 40
max-gen = 150
per-rotor = 3
max-steps = 6000000000
no-rechange = 4,60
clear = r -30 -30 4 -1        # behind and beside the glider: empty, so it comes from infinity
clear = r -30 -30 -1 4
pattern:
x = 5, y = 5, rule = LifeHistory
BBBBB$BBCBB$BBBCB$BCCCB$BBBBB!
