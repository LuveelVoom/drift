# One cell switched on in an unknown background, in B3/S23-a5: drift designs the
# whole oscillator around it. A run of about 20 s on 14 cores finds oscillators
# from p4 to p15.
rule = B3/S23-a5
max-changed = 6
size = 4x4
skip = fizzle, stable
min-period = 4
no-pics
max-steps = 3000000000
pattern:
x = 1, y = 1, rule = LifeHistory
C!
