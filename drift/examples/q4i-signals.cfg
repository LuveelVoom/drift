# A free signal search in B3/S23-q4i: one spark cell, and only results where
# something is still travelling at max gen are kept. This found the diagonal
# 2c/3 wire in ../../findings/B3-S23-q4i/ (tools/wirebuild.py then made it
# exactly periodic).
rule = B3/S23-q4i
max-changed = 6
size = 4x4
margin = 50
max-gen = 80
skip = oscillator, fizzle, stable
per-rotor = 3
no-pics
max-steps = 3000000000
pattern:
x = 1, y = 1, rule = LifeHistory
C!
