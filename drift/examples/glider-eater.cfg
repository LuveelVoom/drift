# Glider eaters: a glider flies south-east through a cleared area into unknown
# background. Eaters are fizzles named 'g-eater ...'; unnamed ones are new.
max-changed = 10
size = 5x5
clear = r -12 -12 5 5     # empty space the glider arrives through
skip = oscillator         # show only fizzles (eaters)
pattern:
.1.
..1
111!
