# Tutorial example (docs/GUIDE.md): oscillators started by a spark next to a
# beehive, in Life. The area above the beehive must stay empty.
rule = B3/S23
max-changed = 6
size = 4x4
skip = fizzle
per-rotor = 3

# Rows/columns count from the pattern's top-left cell (row 0, col 0).
clear = r -4 -2 -1 5        # rows -4..-1 (above the pattern), cols -2..5

pattern:
x = 4, y = 4, rule = LifeHistory
B2AB$A2BA$B2AB$3BC!
