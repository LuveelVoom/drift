# Billiard tables with 180-degree rotational symmetry (Sokwe's dr2 example).
# The centre 3x3 is unknown and its background isn't required to be stable
# (dr2's '4' cells), and those cells don't count towards the size limits.
max-changed = 18
size = 9x9
symmetry = rot180
pattern-no-count
skip = stable, fizzle
only-new              # hide oscillators already in the known rotors list

pattern:
444
444
444!
