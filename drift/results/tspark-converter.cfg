# HighLife: the same T spark; look for reactions where the still life recovers
# and something keeps travelling (spaceships or signals). A glider is far from
# the still life by gen 120, so only clean departures survive the size limit.
rule = B36/S23
max-changed = 16
size = 14x14
margin = 50
max-gen = 120
skip = oscillator, fizzle, stable
per-rotor = 0                # all max-gen results look alike to drift's grouping
max-steps = 30000000000

pattern:
x = 10, y = 13, rule = LifeHistory
6B$6B$6B$10B$10B$8BCB$7B2CB$8BCB$10B$10B$6B$6B$6B!
