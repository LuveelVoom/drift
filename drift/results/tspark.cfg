# HighLife: a T-shaped spark arrives from outside (it isn't part of the still
# life: one empty cell separates it from anything drift builds on its right).
# Keeps oscillators and catalysts; finish.py sorts them.
rule = B36/S23
max-changed = 14
size = 7x7
skip = stable
max-steps = 20000000000      # about a minute

pattern:
x = 10, y = 13, rule = LifeHistory
6B$6B$6B$10B$10B$8BCB$7B2CB$8BCB$10B$10B$6B$6B$6B!
